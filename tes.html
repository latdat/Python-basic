<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trích Xuất Văn Bản Từ Ảnh</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.3em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #666;
            font-size: 0.95em;
        }

        input[type="file"] {
            display: none;
        }

        .language-selector {
            margin-top: 20px;
            text-align: center;
        }

        .language-selector label {
            font-weight: 600;
            color: #333;
            margin-right: 10px;
        }

        .language-selector select {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }

        .process-btn {
            display: none;
            margin: 20px auto;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }

        .process-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .process-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .preview-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .preview-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2em;
            line-height: 1;
        }

        .results-section {
            display: none;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .result-header h3 {
            color: #667eea;
            font-size: 1.2em;
        }

        .result-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .result-text {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 1em;
            color: #333;
        }

        .copy-btn, .download-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            margin-left: 10px;
        }

        .copy-btn {
            background: #667eea;
            color: white;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .download-btn {
            background: #10b981;
            color: white;
        }

        .download-btn:hover {
            background: #059669;
        }

        .progress-section {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .progress-text {
            text-align: center;
            color: #666;
            margin-top: 10px;
        }

        .download-all-btn {
            display: none;
            margin: 20px auto;
            padding: 15px 40px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s;
        }

        .download-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .upload-section {
                padding: 20px;
            }

            .result-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Trích Xuất Văn Bản Từ Ảnh</h1>
            <p>Tải lên nhiều ảnh và trích xuất văn bản tự động</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">Kéo thả ảnh vào đây hoặc nhấn để chọn</div>
                <div class="upload-hint">Hỗ trợ: JPG, PNG, GIF (nhiều ảnh)</div>
            </div>
            <input type="file" id="fileInput" multiple accept="image/*">
            
            <div class="language-selector">
                <label for="languageSelect">Ngôn ngữ:</label>
                <select id="languageSelect">
                    <option value="vie">Tiếng Việt</option>
                    <option value="eng">English</option>
                    <option value="chi_sim">简体中文</option>
                    <option value="jpn">日本語</option>
                    <option value="kor">한국어</option>
                </select>
            </div>

            <div class="preview-grid" id="previewGrid"></div>
            
            <button class="process-btn" id="processBtn">🚀 Bắt Đầu Trích Xuất</button>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
            <div class="progress-text" id="progressText">Đang xử lý...</div>
        </div>

        <button class="download-all-btn" id="downloadAllBtn">📥 Tải Xuống Tất Cả</button>

        <div class="results-section" id="resultsSection"></div>
    </div>

    <script>
        let selectedFiles = [];
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');
        const processBtn = document.getElementById('processBtn');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const resultsSection = document.getElementById('resultsSection');
        const languageSelect = document.getElementById('languageSelect');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        let allResults = [];

        // Xử lý click vào upload area
        uploadArea.addEventListener('click', () => fileInput.click());

        // Xử lý chọn file
        fileInput.addEventListener('change', handleFiles);

        // Xử lý drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
            addFiles(files);
        });

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            addFiles(files);
        }

        function addFiles(files) {
            files.forEach(file => {
                if (!selectedFiles.find(f => f.name === file.name)) {
                    selectedFiles.push(file);
                    displayPreview(file);
                }
            });
            
            if (selectedFiles.length > 0) {
                processBtn.style.display = 'block';
            }
        }

        function displayPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <img src="${e.target.result}" alt="${file.name}">
                    <button class="remove-btn" onclick="removeFile('${file.name}')">×</button>
                `;
                previewGrid.appendChild(div);
            };
            reader.readAsDataURL(file);
        }

        function removeFile(fileName) {
            selectedFiles = selectedFiles.filter(f => f.name !== fileName);
            renderPreviews();
            
            if (selectedFiles.length === 0) {
                processBtn.style.display = 'none';
            }
        }

        function renderPreviews() {
            previewGrid.innerHTML = '';
            selectedFiles.forEach(file => displayPreview(file));
        }

        // Xử lý OCR
        processBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            processBtn.disabled = true;
            progressSection.style.display = 'block';
            resultsSection.style.display = 'block';
            resultsSection.innerHTML = '';
            allResults = [];

            const language = languageSelect.value;
            const total = selectedFiles.length;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const percent = Math.round(((i + 1) / total) * 100);
                
                progressBar.style.width = percent + '%';
                progressBar.textContent = percent + '%';
                progressText.textContent = `Đang xử lý ảnh ${i + 1}/${total}: ${file.name}`;

                try {
                    const result = await Tesseract.recognize(file, language, {
                        logger: m => console.log(m)
                    });

                    const text = result.data.text.trim();
                    allResults.push({ fileName: file.name, text: text });
                    displayResult(file, text);
                } catch (error) {
                    console.error('Lỗi OCR:', error);
                    displayResult(file, 'Lỗi: Không thể trích xuất văn bản từ ảnh này.');
                }
            }

            progressText.textContent = `✅ Hoàn thành! Đã xử lý ${total} ảnh.`;
            processBtn.disabled = false;
            downloadAllBtn.style.display = 'block';
        });

        function displayResult(file, text) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="result-header">
                        <h3>📄 ${file.name}</h3>
                        <div>
                            <button class="copy-btn" onclick="copyText(this)">📋 Sao Chép</button>
                            <button class="download-btn" onclick="downloadText('${file.name}', this)">💾 Tải Xuống</button>
                        </div>
                    </div>
                    <img src="${e.target.result}" alt="${file.name}" class="result-image">
                    <div class="result-text">${text || 'Không tìm thấy văn bản trong ảnh.'}</div>
                `;
                resultsSection.appendChild(card);
            };
            reader.readAsDataURL(file);
        }

        function copyText(button) {
            const text = button.closest('.result-card').querySelector('.result-text').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = '✅ Đã Sao Chép!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }

        function downloadText(fileName, button) {
            const text = button.closest('.result-card').querySelector('.result-text').textContent;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName.replace(/\.[^/.]+$/, '') + '.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        downloadAllBtn.addEventListener('click', () => {
            let combinedText = '';
            allResults.forEach(result => {
                combinedText += `=== ${result.fileName} ===\n\n${result.text}\n\n${'='.repeat(50)}\n\n`;
            });

            const blob = new Blob([combinedText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tat-ca-van-ban.txt';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
